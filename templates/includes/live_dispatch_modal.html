<!-- Live Dispatch Animation Modal Component -->
<div id="liveDispatchModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md hidden">
  <div class="card rounded-2xl p-4 sm:p-6 max-w-2xl w-full border border-brand-500/40 bg-gradient-to-b from-slate-900 via-indigo-950/90 to-black shadow-2xl shadow-brand-500/20 space-y-4 sm:space-y-5 animate-in fade-in duration-200 max-h-[92vh] overflow-y-auto">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-white/10 pb-3">
      <div class="flex items-center gap-2 sm:gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-dot flex-shrink-0"></span>
        <h3 class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider">🚀 Live Dispatcher</h3>
        <span id="liveStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30 whitespace-nowrap">
          Connecting...
        </span>
      </div>
      <button type="button" onclick="closeLiveDispatchModal()" class="text-white/40 hover:text-white text-lg font-bold p-1 cursor-pointer transition-colors" title="Close">
        ✕
      </button>
    </div>

    <!-- Animated Transmission Visual -->
    <div class="p-4 sm:p-5 rounded-xl bg-white/2 border border-white/10 relative overflow-hidden text-center space-y-3">
      <!-- Radar Pulse Waves Background -->
      <div class="relative flex items-center justify-center py-2 sm:py-3">
        <div class="absolute w-24 sm:w-28 h-24 sm:h-28 rounded-full bg-emerald-500/10 animate-ping opacity-60"></div>
        <div class="absolute w-16 sm:w-20 h-16 sm:h-20 rounded-full bg-brand-500/20 animate-pulse"></div>
        <!-- Center Floating Icon -->
        <div class="relative w-12 sm:w-14 h-12 sm:h-14 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-emerald-500 flex items-center justify-center text-xl sm:text-2xl shadow-xl shadow-brand-500/40">
          ✉️
        </div>
      </div>

      <div class="space-y-1">
        <p class="text-xs text-white/50" id="liveTransmissionState">Preparing transmission...</p>
        <p class="text-xs sm:text-sm font-mono font-bold text-emerald-300 truncate max-w-lg mx-auto" id="liveCurrentTarget">
          Connecting to Gmail API...
        </p>
      </div>

      <!-- Live Progress Bar -->
      <div class="space-y-1.5 pt-1 sm:pt-2">
        <div class="flex items-center justify-between text-xs text-white/60 font-mono">
          <span id="liveBatchProgressText">Progress: 0 / 20</span>
          <span id="liveProgressPercent" class="font-bold text-brand-300">0%</span>
        </div>
        <div class="w-full bg-white/10 rounded-full h-2 sm:h-2.5 overflow-hidden p-0.5">
          <div id="liveProgressBar" class="h-full rounded-full bg-gradient-to-r from-brand-500 via-indigo-500 to-emerald-400 transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Live Counters -->
    <div class="grid grid-cols-3 gap-2 sm:gap-3 text-center">
      <div class="p-2 sm:p-2.5 rounded-lg bg-black/40 border border-white/10">
        <div class="text-[9px] sm:text-[10px] text-white/40 uppercase">This Batch</div>
        <div class="text-sm sm:text-base font-black text-white font-mono" id="liveSentCount">0</div>
      </div>
      <div class="p-2 sm:p-2.5 rounded-lg bg-black/40 border border-white/10">
        <div class="text-[9px] sm:text-[10px] text-white/40 uppercase">Sent Today</div>
        <div class="text-sm sm:text-base font-black text-emerald-400 font-mono" id="liveSentTodayCount">{{ sent_today|default:"0" }}</div>
      </div>
      <div class="p-2 sm:p-2.5 rounded-lg bg-black/40 border border-white/10">
        <div class="text-[9px] sm:text-[10px] text-white/40 uppercase">Pacing</div>
        <div class="text-[10px] sm:text-xs font-bold text-brand-300 font-mono mt-0.5 sm:mt-1 truncate" id="livePacingBadge">Active (1.2s)</div>
      </div>
    </div>

    <!-- Live Console Output Terminal -->
    <div class="space-y-1.5">
      <div class="flex items-center justify-between text-[11px] text-white/50 font-mono">
        <span>Live Dispatch Console Feed:</span>
        <button type="button" onclick="clearLiveConsole()" class="hover:text-white text-[10px] cursor-pointer">Clear</button>
      </div>
      <div id="liveConsoleOutput" class="h-28 sm:h-36 overflow-y-auto p-2.5 sm:p-3 rounded-xl bg-black/80 border border-white/10 font-mono text-[11px] sm:text-xs space-y-1 select-all shadow-inner leading-relaxed">
        <div class="text-white/40 text-[10px] sm:text-[11px]">// Live engine ready. Press start or wait for dispatch stream...</div>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-between gap-2.5 pt-2 border-t border-white/10">
      <a href="/campaigns/tracking/" id="btnViewTracking" class="text-center px-4 py-2 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-500 text-white flex items-center justify-center gap-1.5 shadow transition-colors">
        📊 View Tracking →
      </a>
      <button type="button" onclick="closeLiveDispatchModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/20 text-white transition-colors cursor-pointer text-center">
        Close
      </button>
    </div>

  </div>
</div>

<script>
  async function startLiveDispatch(campaignId = '', campaignName = 'Live Queue', batchSize = 20) {
    const modal = document.getElementById('liveDispatchModal');
    const statusBadge = document.getElementById('liveStatusBadge');
    const transState = document.getElementById('liveTransmissionState');
    const currTarget = document.getElementById('liveCurrentTarget');
    const pBar = document.getElementById('liveProgressBar');
    const pText = document.getElementById('liveBatchProgressText');
    const pPct = document.getElementById('liveProgressPercent');
    const sentCountEl = document.getElementById('liveSentCount');
    const consoleBox = document.getElementById('liveConsoleOutput');

    if (!modal) return;
    modal.classList.remove('hidden');
    consoleBox.innerHTML = '';
    pBar.style.width = '0%';
    pPct.textContent = '0%';
    pText.textContent = `Progress: 0 / ${batchSize}`;
    sentCountEl.textContent = '0';
    statusBadge.textContent = 'Connecting...';
    statusBadge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30';
    transState.textContent = `Initiating dispatch for: ${campaignName}`;
    currTarget.textContent = 'Connecting to Gmail API...';

    appendConsoleLog(`🚀 Connecting to live dispatch stream (Batch: ${batchSize} emails)...`, 'text-brand-300 font-semibold');

    try {
      const url = `/scheduler/live-dispatch/?campaign_id=${encodeURIComponent(campaignId)}&batch_size=${batchSize}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCsrfToken(),
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error(`Server returned HTTP ${response.status}`);
      }

      statusBadge.textContent = '● Dispatching';
      statusBadge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep trailing incomplete chunk

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const data = JSON.parse(trimmed);
            handleDispatchEvent(data);
          } catch (e) {
            console.warn('NDJSON parse error:', e, trimmed);
          }
        }
      }

      appendConsoleLog('🎉 Stream transmission completed.', 'text-emerald-400 font-bold');
      statusBadge.textContent = '✓ Finished';
      statusBadge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/30 text-emerald-300 border border-emerald-500/50';
      transState.textContent = 'Batch completed successfully!';
      currTarget.textContent = 'All emails dispatched to Gmail';

    } catch (err) {
      console.error('Live dispatch error:', err);
      appendConsoleLog(`❌ Transmission halted: ${err.message}`, 'text-red-400 font-bold');
      statusBadge.textContent = '⚠️ Error';
      statusBadge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-500/20 text-red-300 border border-red-500/30';
      transState.textContent = 'Dispatch halted';
      currTarget.textContent = err.message;
    }
  }

  function handleDispatchEvent(data) {
    const pBar = document.getElementById('liveProgressBar');
    const pText = document.getElementById('liveBatchProgressText');
    const pPct = document.getElementById('liveProgressPercent');
    const sentCountEl = document.getElementById('liveSentCount');
    const sentTodayEl = document.getElementById('liveSentTodayCount');
    const transState = document.getElementById('liveTransmissionState');
    const currTarget = document.getElementById('liveCurrentTarget');

    if (data.type === 'sending') {
      transState.textContent = `Dispatching [${data.index}/${data.total}]`;
      currTarget.textContent = data.email;
      appendConsoleLog(`✉️ [${data.index}/${data.total}] Dispatching to ${data.email}...`, 'text-white/80');
    } else if (data.type === 'sent') {
      sentCountEl.textContent = data.index;
      if (data.sent_today !== undefined) {
        sentTodayEl.textContent = data.sent_today;
      }
      const pct = Math.min(100, Math.round((data.index / data.total) * 100));
      pBar.style.width = `${pct}%`;
      pPct.textContent = `${pct}%`;
      pText.textContent = `Progress: ${data.index} / ${data.total}`;
      appendConsoleLog(`✓ [${data.index}/${data.total}] SENT → ${data.email} (${data.msg_id})`, 'text-emerald-400 font-medium');
    } else if (data.type === 'pacing') {
      transState.textContent = `Pacing jitter delay (${data.delay}s)...`;
      appendConsoleLog(`⏳ Jitter delay: ${data.delay}s anti-spam pacing`, 'text-yellow-300/70 text-[11px]');
    } else if (data.type === 'failed') {
      appendConsoleLog(`⚠️ [${data.index}/${data.total}] FAILED: ${data.email} — ${data.error}`, 'text-red-400');
    } else if (data.type === 'done') {
      pBar.style.width = '100%';
      pPct.textContent = '100%';
      if (data.sent_today !== undefined) {
        sentTodayEl.textContent = data.sent_today;
      }
      appendConsoleLog(data.message, 'text-emerald-300 font-bold bg-emerald-500/10 p-1.5 rounded');
    } else if (data.type === 'info' || data.type === 'auth' || data.type === 'init' || data.type === 'campaign_info') {
      appendConsoleLog(data.message, 'text-brand-300');
    } else if (data.type === 'error') {
      appendConsoleLog(data.message, 'text-red-400 font-bold');
      currTarget.textContent = data.message;
    }
  }

  function appendConsoleLog(msg, colorClass = 'text-white/70') {
    const box = document.getElementById('liveConsoleOutput');
    if (!box) return;
    const timeStr = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.className = `${colorClass} flex items-start gap-1.5`;
    line.innerHTML = `<span class="text-white/30 text-[10px] select-none">[${timeStr}]</span> <span>${msg}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function closeLiveDispatchModal() {
    const modal = document.getElementById('liveDispatchModal');
    if (modal) modal.classList.add('hidden');
    // Reload page so updated counters reflect immediately
    window.location.reload();
  }

  function clearLiveConsole() {
    const box = document.getElementById('liveConsoleOutput');
    if (box) box.innerHTML = '';
  }
</script>
