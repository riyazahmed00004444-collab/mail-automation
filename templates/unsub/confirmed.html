<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unsubscribed — BidAlert</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #4ade80; }
    p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
    .email { color: #818ef8; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Unsubscribed</h1>
    <p>You've been successfully removed from our mailing list.</p>
    <p><span class="email">{{ email }}</span> will no longer receive marketing emails from BidAlert.in.</p>
    <p style="font-size:12px; color:rgba(255,255,255,0.3);">If you'd like to re-subscribe in the future, visit bidalert.in or email support@bidalert.in.</p>
  </div>
</body>
</html>
